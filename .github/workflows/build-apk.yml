name: Build Gemini APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gemini-pixel10a-debug-signing-v2
      - name: Ensure persistent debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set increasing app version
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '1.1.$GITHUB_RUN_NUMBER'/" app/build.gradle
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify APK signature
        run: |
          test -f "$HOME/.android/debug.keystore"
          jarsigner -verify -verbose -certs app/build/outputs/apk/debug/app-debug.apk >/dev/null
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Pixel10a-debug
          path: app/build/outputs/apk/debug/app-debug.apk
